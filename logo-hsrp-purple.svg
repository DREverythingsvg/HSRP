<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 222" width="377" height="222">
  <defs>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Dark Obsidian Purple Background -->
  <rect width="377" height="222" fill="#13071b" rx="14"/>
  <!-- Purple Frame Box matching the user's reference -->
  <rect x="75" y="69" width="227" height="84" fill="none" stroke="url(#purpleGradient)" stroke-width="7" filter="url(#purpleGlow)"/>
  <!-- HSRP Bold Centered Typography -->
  <text x="188.5" y="131" text-anchor="middle" font-family="'Outfit', 'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="2.5" fill="url(#purpleGradient)" filter="url(#purpleGlow)">HSRP</text>
</svg>
